info:
  name: Generate Hex Key
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/secrets/{{namespace}}/keys/{{key}}/generate"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "type": "hex",
        "length": 64
      }
