info:
  name: Bulk Put Secrets
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/secrets/{{namespace}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "secrets": {
          "db_password": "secret1",
          "api_key": "secret2"
        }
      }
