info:
  name: Generate Secret
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/secrets/{{namespace}}/keys/{{key}}/generate"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "type": "password",
        "length": 32,
        "charset": "alphanumeric"
      }
