info:
  name: Put Secret
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/secrets/{{namespace}}/keys/{{key}}"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "value": "super-secret-123"
      }
