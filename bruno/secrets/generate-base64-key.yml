info:
  name: Generate Base64 Key
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/v1/secrets/{{namespace}}/keys/{{key}}/generate"
  headers:
    - name: Authorization
      value: "Bearer {{token}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "type": "base64",
        "length": 32
      }
