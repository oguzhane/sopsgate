info:
  name: Get Secret at Version
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/secrets/{{namespace}}/keys/{{key}}/versions/{{version}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}

runtime:
  variables:
    - name: version
      value: 595a5f7

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
